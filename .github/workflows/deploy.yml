name: CI and GitHub Pages forwarding

# The site and its API run on Cloudflare (wrangler.jsonc, `npm run deploy`).
# This workflow checks every push and publishes the old GitHub Pages address
# as a page that forwards visitors (and their #/route) to the Cloudflare site.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run test:worker
      - run: npm run test:integration
      - run: npm run build
      - name: Prepare the forwarding page
        run: |
          mkdir -p forward
          sed "s#__SITE_URL__#${{ vars.SITE_URL || 'https://eka-semijoias.eka-semijoias.workers.dev/' }}#g" deploy/github-pages/index.html > forward/index.html
          cp forward/index.html forward/404.html
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: forward

  pages:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
