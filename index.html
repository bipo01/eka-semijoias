<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ÉKA Semijoias · Semijoias com acabamento impecável</title>
    <meta name="description" content="Brincos, colares, anéis, pulseiras e conjuntos com acabamento impecável. Escolha no site e peça pelo WhatsApp." />
    <meta name="theme-color" content="#FBF8F5" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ÉKA" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <!-- The Worker rewrites title, description, share picture and the hero preload per page (worker/seo.ts). -->
    <!-- Start the catalog request in parallel with the JS bundle (consumed by fetch in src/store/catalog.ts). -->
    <link rel="preload" href="%BASE_URL%api/catalog" as="fetch" crossorigin="anonymous" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ÉKA Semijoias" />
    <meta property="og:title" content="ÉKA Semijoias · Semijoias com acabamento impecável" />
    <meta property="og:description" content="Brincos, colares, anéis, pulseiras e conjuntos com acabamento impecável. Escolha no site e peça pelo WhatsApp." />
    <meta property="og:image" content="https://eka-semijoias.eka-semijoias.workers.dev/og-image.jpg" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- First built-in hero slide, per screen (media, srcset and sizes match the <picture> of src/components/home/Hero.tsx and src/data/heroFrames.ts). -->
    <link rel="preload" as="image" type="image/webp" media="(max-width: 767px)" href="%BASE_URL%images/hero/colo-celular-1024.webp"
      imagesrcset="%BASE_URL%images/hero/colo-celular-640.webp 640w, %BASE_URL%images/hero/colo-celular-1024.webp 1024w, %BASE_URL%images/hero/colo-celular-1600.webp 1600w"
      imagesizes="100vw" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" media="(min-width: 1280px) and (max-width: 1799px)" href="%BASE_URL%images/hero/colo-computador-1024.webp"
      imagesrcset="%BASE_URL%images/hero/colo-computador-640.webp 640w, %BASE_URL%images/hero/colo-computador-1024.webp 1024w, %BASE_URL%images/hero/colo-computador-1600.webp 1600w"
      imagesizes="55vw" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Para ver as nossas peças, ative o JavaScript do navegador.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
